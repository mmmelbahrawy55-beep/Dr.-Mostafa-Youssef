<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مفيش اتصال | د. مصطفى يوسف</title>
    <meta name="theme-color" content="#08090a" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #1a2110, #08090a 60%);
        color: #f5f2e9;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 24px;
        padding: 36px 28px;
      }
      .dot {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: rgba(212, 255, 63, 0.12);
        color: #d4ff3f;
        font-size: 26px;
      }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { color: rgba(245, 242, 233, 0.6); font-size: 14px; line-height: 1.8; margin: 0 0 22px; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #d4ff3f;
        color: #08090a;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
        padding: 12px 22px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="dot" aria-hidden="true">⚡</div>
      <h1>مفيش اتصال بالإنترنت</h1>
      <p>الصفحة دي محتاجة اتصال عشان تفتح. اتأكد من الشبكة وجرب تاني — بياناتك ومدفوعاتك محفوظة بأمان.</p>
      <a href="/">جرّب تاني</a>
    </main>
  </body>
</html>
